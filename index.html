<script type="text/plain" id="cd-st">
const D=`🌐|System|A set of interrelated elements with inputs, outputs and processes that turn inputs into outputs to meet a goal.|A bakery: flour goes in, bread comes out, and bakers and ovens work together in between.
🧩|Holism|Seeing the whole as primary and the parts as secondary: a system is more than the sum of its parts.|A song is more than a pile of separate notes.
🔬|Reductionism|Explaining something by breaking it into its smallest parts and studying each part in isolation.|Taking a watch apart to find time, then finding no time inside any single gear.
⚙️|Machine Age|The scientific era that treated the world like a machine of causal laws and analysed it down to indivisible parts.|Treating a forest as a heap of timber instead of a living community.
🌱|Systems Age|The era that studies systems as wholes and explains the parts in terms of the whole, not the other way round.|Understanding the heart by what it does for the body, not as a lump of muscle.
🌲|Systems Thinking|A mindset for seeing the big picture and the interactions between parts: the art of seeing the forest and the trees.|Looking at a city from a hilltop: you see the streets and how traffic flows between them.
✨|Emergence|A property that belongs to the whole system and to none of its parts alone.|Wetness belongs to water, yet no single water molecule is wet.
🌀|Complexity|Difficulty that stems from many interconnected parts and interactions, not just from size.|A traffic jam: no single car causes it, yet it appears.
🪢|Wicked Problem|A messy, ill-defined problem with no single agreed definition or final solution, where stakeholders disagree.|Fixing a city's traffic: every fix changes the problem and everyone wants something different.
🎯|Goal Seeking|A system exists for a purpose, and its behaviour is directed at reaching its goals.|A taxi driving toward the passenger's destination.
📥|Inputs and Outputs|A system takes inputs from its environment and releases outputs back into it.|A coffee machine: water and beans in, coffee out.
🔄|Transformation Process|The activities inside a system that convert its inputs into outputs.|The oven that turns dough into bread.
🎛️|Regulation|A system monitors itself and applies control so that its behaviour stays on course.|Cruise control keeping the car at 90 km/h.
🪜|Hierarchy|A system contains subsystems and can itself be a part of a larger system.|Russian dolls: each one fits inside a bigger one.
🧬|Differentiation|As a system grows, its parts specialise in different functions.|A hospital with separate departments for surgery, laboratory and pharmacy.
🛣️|Equifinality|A system can reach the same end state through different paths and means.|Many different roads that all lead to the same city.
🧱|Boundary|The line that separates a system from its environment and defines what is inside the system of interest.|The fence around a school compound.
🌍|Environment|Everything outside the boundary that influences the system or is influenced by it.|The weather, roads and neighbours around a school.
🚪|Open System|A system that exchanges inputs and outputs with its environment and depends on it.|A shop that buys stock from suppliers and sells to customers.
🔒|Closed System|A system with little or no exchange with its environment, at least in theory.|A sealed terrarium.
🌫️|Entropy|The tendency of a system to drift toward disorder unless effort keeps it organised.|A bedroom that gets messy unless you keep tidying it.
🏺|Teleology|Explaining things by the purpose they serve. Aristotle saw the parts of the world only through their relation to the whole.|Explaining a knife by its purpose of cutting, not by its chemistry.
📚|Tektology|Bogdanov's universal science of organization: every human activity, technical or social, follows organizational laws.|One rulebook of teamwork that fits ants, firms and orchestras.
🧪|General Systems Theory|Von Bertalanffy's open-system theory, which rejected the mechanistic and reductionist models of biology and psychology.|A map of laws that apply to cells, companies and cities alike.
📡|Cybernetics|Wiener's science of control and communication in animals and machines, built on feedback.|A pilot who keeps reading the instruments and correcting the course.
🏭|Industrial Dynamics|Forrester's study of how information feedback, policies and delays shape the success of a business; the start of System Dynamics.|A supply chain where a small change in shop orders becomes a huge swing at the factory.
🔭|Systems Science|The post-war movement that put science back together to study phenomena as wholes, through inter-disciplines like Cybernetics and Systems Engineering.|Reassembling a puzzle that the Machine Age had cut into narrow pieces.
🏢|Organization|A formal social structure that takes inputs from its environment and processes them into outputs. It operates through human activity.|A university: students and funding in, graduates and research out.
👥|Enterprise|A group of people with a common goal and the resources to achieve that goal.|A football club: players, a shared goal and a budget.
📋|Business Process|A set of coordinated activities, in an organizational and technical environment, that jointly realize a business goal.|Handling an order: receive, check stock, take payment, ship.
💻|Information System|An arrangement of people, data, processes, communication and IT that captures, stores and delivers information to support operations and decisions.|A hospital records system that lets doctors, nurses and pharmacists all see the same patient file.
🧭|Decision Levels|Managers decide at three levels: strategic (direction), tactical (planning) and operational (daily work).|A ship: the captain picks the destination, the officers plan the route, the crew steers.
💎|Value of Information|Information systems create value by cutting cost, improving processes, raising customer satisfaction, and aligning with goals.|A lighthouse that makes the whole harbour safer and faster.
🏭|ERP|Enterprise Resource Planning: integrated management of the main business processes, with one shared database for every department.|One shared notebook for the whole company instead of a separate notebook per department.
🛠️|ERP Life Cycle|The path of an ERP project: AS-IS documentation, TO-BE documentation, software and vendor selection, implementation, go live, post-implementation.|Renovating a house: survey the old one, design the new one, pick a builder, build, move in, fix leftovers.
🔗|End-to-End Process|Cycles such as Procure-to-Pay and Order-to-Cash that run across departments to remove fragmentation and improve integration.|A relay race where the baton never touches the ground between runners.
🗺️|Model|A representation of part of reality made for a purpose: a tool for thinking.|A city map: it leaves out most details so you can find your way.
✂️|Abstraction|Stripping an idea or system of its concrete features so that only the relevant ones remain.|A metro map that keeps stations and lines but ignores the streets above.
🧱|Simple Models|Models should be simple but complete: start small, then refine by enriching them or reformulating them.|Sketching a house in pencil before drawing the final blueprint.
📐|System Model|A model that specifies the transformation process, the boundary, subsystems, inputs, decision rules and desired or undesired outputs.|A control-room diagram of a factory showing what goes in, what happens and what comes out.
🏗️|Hard Systems Thinking|Assumes organizations can be objectively studied, modelled and controlled to meet a defined purpose. The question is how to solve a clearly defined problem.|Building a bridge: the goal is clear and engineers calculate how.
🗣️|Soft Systems Thinking|Assumes problems are ill-structured, with several valid interpretations. Inquiry is organised as a learning system that integrates stakeholder views.|A community meeting where everyone sees the problem differently and they must learn from each other.
⏳|System Dynamics|An approach to understanding the non-linear behaviour of complex systems over time using stocks, flows, feedback loops and time delays.|A weather simulator that shows how a storm builds and fades over days.
➡️|Linear Thinking|Factors are independent, cause runs one way and every factor matters equally.|A row of dominoes: push the first and the rest simply fall.
🔁|Closed-Loop Thinking|Factors depend on each other, causality is circular, and some factors matter more than others.|A conversation: what you say changes what I say, which changes what you say next.
🧶|Causal Loop Diagram|A map of a system's variables and the arrows between them that reveals its feedback loops and structure.|A subway map of influences rather than stations.
🛁|Stock and Flow Diagram|The quantitative version of a causal loop diagram: stocks accumulate, flows fill or drain them, and the model can be simulated.|A bathtub: the water level is the stock, the tap and the drain are the flows.
♻️|Feedback Loop|A chain of cause and effect that returns to its start, so the output of a system influences its own input.|A microphone too close to the speaker: the sound feeds itself.
⛄|Reinforcing Loop|A feedback loop where change in one direction produces more change in the same direction, giving growth or collapse.|A snowball rolling downhill, getting bigger and faster.
🌡️|Balancing Loop|A feedback loop that counters change and pushes the system back toward a goal or limit.|A thermostat that switches the heater on and off to hold the temperature.
⏲️|Time Delay|The gap between an action and its effect, which can make a system overshoot or swing back and forth.|A shower that takes time to warm up, so you keep turning the knob and get scalded.
🧮|Simulation|Running a stock and flow model over time to see how the system behaves.|A flight simulator for a business: crash it safely in the model.
🧱|Structure Determines Behaviour|A system's own structure of loops, stocks and delays produces its behaviour, rather than outside blame.|The shape of a riverbed decides how the water flows, not the water's mood.
🌫️|Soft Systems Methodology|Checkland's organised but flexible learning process for messy problem situations that people see as problematic and want to improve.|A guided group conversation that turns confusion into agreed action.
🖍️|Rich Picture|A drawing of a problem situation showing people, structures, processes, conflicts and concerns. Used in the finding-out stages of SSM.|A comic strip of everything going on in the problem.
👓|Weltanschauung|A person's worldview: the internalised, taken-for-granted assumptions that shape how they see a situation.|Tinted glasses: red glasses make the world look red.
📝|Root Definition|A concise statement of a relevant system, captured with the CATWOE mnemonic.|A one-sentence mission statement for an ideal system.
🔤|CATWOE|Customers, Actors, Transformation process, Weltanschauung, Owners and Environmental constraints: the checklist for a root definition.|A six-point checklist before takeoff.
🕹️|Conceptual Model|A human activity model built from about 7 plus or minus 2 verbs, plus a monitoring and control subsystem.|A flowchart of what an ideal system would have to do.
💎|Five Es|Efficiency, Effectiveness, Efficacy, Ethicality and Elegance: the criteria for judging a human activity model.|Five judges at a competition, each scoring something different.
🤝|Desirable and Feasible|Changes agreed in SSM must be systemically desirable and also culturally feasible before they are put into action.|A plan that is good on paper and also fits how people really work.
❤️|Design Thinking|A human-centred, empathetic approach that starts from the customer and treats problem solving as a mindset and a process.|A tailor who measures you before cutting the cloth.
🌐|Systems and Design Thinking|Systems thinking brings the holistic view, design thinking brings empathy. Combined, they are holistic, empathetic and innovative.|A map plus a local guide: you see the whole city and feel the neighbourhood.

<script type="text/plain" id="cd-soa">
const D=`🏛️|Software Architecture|The big-picture plan of a system: its parts, how they connect, and the rules that guide its design.|A building's blueprint, drawn before any bricks are laid.
🔧|Service|A self-contained piece of software that does one job and is used through a clear interface.|A restaurant kitchen: you order from the menu and never see the chef work.
🔒|Encapsulation|A service hides its inner logic and exposes only its contract (interface).|A vending machine: you press buttons, the machinery stays hidden.
♻️|Reusability|One service can be used by many different applications.|One power outlet that serves every appliance in the house.
🌍|Interoperability|Services on different platforms and languages can still talk using standard protocols.|People who speak different languages using one shared sign language.
🔎|Discoverability|A service can be published, found and invoked easily.|Finding a shop in a mall directory.
🏙️|SOA|Service-Oriented Architecture: building software as many reusable, independent services that cooperate.|A city: transport, utility and finance services each work alone, yet together run the city.
🔗|Loose Coupling|Services depend on each other as little as possible, so one can change without breaking the rest.|Lego bricks: swap one without rebuilding the castle.
🧩|Composability|Small services can be combined into bigger business processes.|Combining ingredients into different meals.
🔄|Agile|Deliver in small iterations, collect feedback constantly and adapt fast to change.|Tasting the soup as you cook instead of after serving.
🚚|CI/CD|Continuous Integration/Delivery: automatically build, test and deploy every code change.|A factory conveyor belt with a quality check at every station.
📦|Containerization|Package an app with all its dependencies so it behaves the same everywhere (Docker).|A shipping container: same box on any ship, train or truck.
🎼|Orchestration|Tools like Kubernetes automate running, scaling and self-healing of many containers.|A conductor directing an orchestra of containers.
🏚️|Operational Systems Layer|The bottom SOA layer: legacy apps, ERP, CRM and databases. SOA wraps them instead of replacing them.|The old plumbing every new tap connects to.
🧱|Service Component Layer|Components that wrap operational systems and expose specific functions as services.|An adapter between an old wall socket and a new device.
📋|Services Layer|The catalog of discoverable services such as GetCustomerDetails, PlaceOrder and CheckInventory.|The menu of a restaurant.
🗺️|Business Process Layer|Orchestrates services into workflows, e.g. FulfillOrder = check stock + pay + ship.|A recipe that combines menu items into a full meal.
📱|Consumer Layer|The top layer where users and apps (portals, mobile apps, partners) use the services.|The dining table where customers actually eat.
🚌|ESB|Enterprise Service Bus: a middleware hub that routes, transforms (XML to JSON) and secures messages between services.|One central bus station instead of a road between every pair of towns.
📒|Service Registry|A directory (yellow pages) where services are listed, found and governed, which encourages reuse.|The phone book for services.
📬|Message Broker|Middleware that queues and delivers messages so services can talk reliably without waiting.|A post office holding letters until the receiver is ready.
🕸️|Distributed System|Many independent computers acting as one: scalable and fault tolerant, but facing latency and network failures.|An ant colony acting as a single creature.
🌐|REST|A simple, web-friendly style using URLs and HTTP. Cacheable and great for public APIs, but can be chatty.|Ordering through simple website links.
✉️|SOAP|A formal XML protocol (Envelope, Header, Body) with strict contracts and strong enterprise security.|A notarised legal letter with a strict format.
⚗️|ACID|Atomicity, Consistency, Isolation, Durability: four guarantees that keep database transactions safe.|A bank transfer that fully happens or not at all.
🏷️|API Versioning|Evolving an API (/v1, /v2) without breaking existing clients. Plan backward compatibility from day one.|A new phone model that still takes the old charger.
🎭|Saga Pattern|A chain of local transactions where each step has a compensating undo step if a later step fails.|Booking a trip: if the hotel fails, you cancel the flight too.
⚡|Circuit Breaker|Stops calls to a failing service (Closed, Open, Half-Open) so it fails fast and can recover.|A fuse box that cuts power before a fire starts.
🚪|API Gateway|A single entry point that routes, combines, secures and rate-limits client requests.|A hotel reception desk.
📞|Synchronous Call|The caller waits for the reply. Simple, but tightly coupled.|A phone call.
📨|Asynchronous Messaging|Fire-and-forget messages: loosely coupled, scalable and resilient.|Sending an email and carrying on with your day.
📢|Publish-Subscribe|A publisher emits one event and every subscriber reacts on its own (1 to many).|A YouTube channel notifying all its subscribers.
🧬|Microservice|A small, independently deployable service that owns one business capability and its data.|A single food stall in a big market.
🗂️|Bounded Context|A Domain-Driven Design boundary; each one becomes a microservice (Catalog, Order, Payment).|Company departments, each with its own vocabulary.
🗄️|Database per Service|Each service owns its database; no direct database access between services.|Every shop keeps its own cash register.
🛠️|DevOps|Culture plus automation (CI/CD, infrastructure as code, monitoring) where teams run what they build.|Chefs who also run their own kitchen.
🪪|Authentication|Proving who you are. Authorization is the separate question of what you may do.|Showing your ID at the door.
🎟️|OAuth 2.0|Delegated login standard ("Login with Google"): the app gets a token and never sees your password.|A valet key: it drives the car but cannot open the trunk.
🔖|JWT|A signed, self-contained token (Header.Payload.Signature) that keeps APIs stateless.|A festival wristband with a tamper-proof stamp.
🤝|mTLS|Both services present certificates and encrypt the link: secure service-to-service talk.|Two agents showing matching badges.
🛡️|Zero Trust|Never trust by default: authenticate and authorize every request, even internal ones.|An office where every single door needs a badge.
🔐|Secrets Vault|A central encrypted store for API keys and passwords. Never commit secrets to code.|A bank safe for passwords.
📜|API Governance|Shared standards (naming, status codes, docs, SLAs) and a registry that keep APIs consistent.|Traffic laws for services.`.split('\n').map(l=>{let a=l.split('|');return{e:a[0],t:a[1],d:a[2],a:a[3]}});

<script type="text/plain" id="cd-spi">
const D=`🩹|Software Process Improvement|Improving how software is developed and maintained, instead of blaming people after the fact.|Fixing the recipe instead of scolding the cook.
🔁|Measure-Analyze-Improve|The core SPI cycle: measure how you work, analyze the data, improve, then repeat.|A fitness tracker: weigh in, review, adjust, repeat.
💥|Process Failure|Disasters from poor requirements, testing, risk management, deployment or monitoring are usually process failures, not one developer’s fault.|A bridge collapse traced to a skipped inspection routine.
⏰|Time and Cost Pressure|Pressure that pushes a product out early, before it is ready.|Pulling a cake out of the oven too soon.
🏃|Developer’s Paradox|Logging feels slow, but discipline makes you faster over time through less rework and better estimates.|Warming up feels slow but saves you from injury.
🧍|PSP|Personal Software Process: a structure for one engineer to measure and improve their own work, for better estimates and fewer defects.|A personal fitness diary for your coding.
⏱️|Time Log|A structured form tracking the time spent in each phase.|A stopwatch receipt for every task.
🐞|Defect Log|Records every mistake with its type and when it was injected and fixed.|A doctor’s chart of every illness you have had.
📑|Project Plan Summary|The final report card: the Estimated column is filled in planning, Actual and Error in the postmortem.|A school report card comparing goals to results.
🏁|Postmortem|The last PSP phase (after Planning, Design, Code, Compile, Test): calculate your final error rate and compare plan to reality.|Watching the match tape after the game.
🗃️|Defect Types|Categories in the defect log: syntax, logical, interface, data and documentation.|Sorting rubbish into labelled bins.
0️⃣|PSP0|Level that adds measurement: phases, time log, defect log, then a coding standard, size measure and process improvement plan (PIP).|Learning to use the ruler.
1️⃣|PSP1|Level that adds estimating and planning from your own past data.|Using last year’s receipts to plan this year’s budget.
2️⃣|PSP2|Level that adds quality management: design review and code review phases to catch defects early.|Proofreading before you print.
🔮|PROBE|PROxy-Based Estimation: break the program into parts, size each from your history, add them up, then use your size-to-time ratio for effort.|Estimating a trip by adding up legs you have driven before.
📈|Earned Value|A way to track progress by the planned value of the tasks you have completed.|Paying a builder for each finished room.
📏|Size Error|(Actual - Estimated) / Estimated. For example 260 LOC against 200 LOC is +30%.|Missing a target and measuring by how much.
📉|Defect Density|Defects injected per 1,000 lines of code (KLOC).|Typos per page of a book.
🥅|Yield|Percent of defects removed before the first compile and test: removed divided by injected.|A net that catches fish before they leave the river.
🔎|Appraisal COQ|Cost of quality spent on design and code reviews.|Checking your bags before the flight.
🔥|Failure COQ|Cost of quality spent in compile and test fixing defects.|Repairing a car after it breaks down.

<div id=ae class=c style="color:#a3162f;font-weight:700;min-height:24px"></div>`;
const go=async(fn,b)=>{$i('ae').textContent='';b.disabled=true;try{let r=await rpc(fn,{p_username:$i('au').value,p_password:$i('ap').value});AU={token:r.token,username:r.username};saveA();tst('Signed in as @'+r.username);enter()}catch(e){$i('ae').textContent=e.message;b.disabled=false}};
$i('al').onclick=e=>go('sq_login',e.target);$i('as').onclick=e=>go('sq_signup',e.target);
['au','ap'].forEach(i=>$i(i).onkeydown=e=>{if(e.key=='Enter')$i('al').click()})}
const spicy=()=>localStorage.sysq_spicy!=='0',pickOne=a=>a[Math.random()*a.length|0];

const ago=(d,t)=>{if(!d)return'not started';if(d==t)return'active today';let n=Math.round((Date.parse(t)-Date.parse(d))/864e5);return n==1?'active yesterday':n+' days ago'};

<div class=card><b>XP, last 7 days</b><div style="display:flex;gap:6px;align-items:flex-end;margin-top:8px">${bars}</div></div><div class=card><b>Module mastery</b><br>${mods}</div>
<b>My courses</b><div id=pc><small>Loading…</small></div><div class=row><button id=pf1>👥 Friends</button><button id=pf2>📚 Switch course</button></div><button class=p id=hm>Home</button>`;
$i('hm').onclick=()=>home();$i('pf1').onclick=friends;$i('pf2').onclick=courses;
let rows={};try{(await rpc('sq_courses',{p_token:AU.token})).forEach(r=>rows[r.course]=r)}catch(e){}
rows[CID]={xp:S.xp,lv:S.lv,streak:S.streak||0};if(!$i('pc'))return;
$i('ptx').textContent='⚡ '+Object.values(rows).reduce((a,r)=>a+r.xp,0)+' XP across all courses';
$i('pc').innerHTML=Object.entries(COURSES).map(([id,c])=>crow(c,rows[id],'',id==CID?'background:#fff4c2':'')).join('')}
async function fprofile(u){if(!AU)return gate();
A.innerHTML=`<div class=row><button id=fpb style="flex:0;width:auto">←</button><h2 class=ac style="margin:0">@${esc(u)}</h2></div><div id=fpc><small>Loading…</small></div>`;$i('fpb').onclick=friends;
try{let p=await rpc('sq_profile',{p_token:AU.token,p_username:u}),rows={},t=T(),tot=0,best=0,last='';p.courses.forEach(r=>{rows[r.course]=r;tot+=r.xp;best=Math.max(best,r.best);if(r.last_active>last)last=r.last_active});

Object.entries(COURSES).map(([id,c])=>crow(c,rows[id])).join('')+
(p.me?'':`<div class=row><button class=p id=fpn>👋 Nudge to study</button><button id=fpr><small>Remove friend</small></button></div>`);
if(!p.me){$i('fpn').onclick=()=>nudge(u,$i('fpn'));$i('fpr').onclick=async()=>{if(!confirm('Remove @'+u+' from your friends?'))return;try{await rpc('sq_unfollow',{p_token:AU.token,p_username:u})}catch(x){}friends()}}}
catch(e){if($i('fpc'))$i('fpc').innerHTML=`<div class=card style="color:#a3162f;font-weight:700">${esc(e.message)}</div>`}}
async function nudge(u,btn){if(btn)btn.disabled=true;try{await rpc('sq_nudge',{p_token:AU.token,p_username:u});tst('👋 Nudged @'+u+'!')}catch(e){tst(e.message)}if(btn)btn.disabled=false}
let ft;

$i('fb').innerHTML=rows.map((x,i)=>{let alive=x.last_active&&x.last_active>=y&&x.streak>0;
return`<div class=card style="padding:10px 14px;${x.me?'background:#fff4c2;':''}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><button data-p="${esc(x.username)}" style="width:auto;margin:0;padding:0;border:0;box-shadow:none;background:none;font-weight:800;text-align:left">${['🥇','🥈','🥉'][i]||(i+1)+'.'} @${esc(x.username)}${x.me?' (you)':''}</button><b style="${alive?'':'opacity:.4'}">🔥 ${alive?x.streak:0}</b></div>
<div class=bar style="margin:6px 0 2px"><i style="width:${x.xp/mx*100}%"></i></div>
<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><small>⚡ ${x.xp} XP · Lv ${x.level}${x.last_active==t?' · +'+x.today_xp+' today':''} · ${ago(x.last_active,t)}</small>${x.me?'':`<span style="display:flex;gap:6px"><button data-n="${esc(x.username)}" aria-label=Nudge style="width:auto;margin:0;padding:2px 10px;box-shadow:none;border-width:1px;${x.last_active==t?'opacity:.5':''}">👋</button><button data-u="${esc(x.username)}" aria-label=Remove style="width:auto;margin:0;padding:2px 8px;box-shadow:none;border-width:1px">✕</button></span>`}</div></div>`}).join('')+(rows.length<2?'<div class=bub style="margin:8px 0">Add a friend by username to compare streaks and XP.</div>':'')}
async function load(){if(!$i('fb'))return;try{paint(await rpc('sq_friends',{p_token:AU.token,p_course:CID}));$i('fs').textContent=CO.name+' · tap a name for their profile'}catch(e){if(/log in again/i.test(e.message)){AU=null;saveA();clearInterval(ft);return gate()}$i('fs').textContent=e.message}}
function friends(){if(!AU)return gate();
A.innerHTML=`<div class=row><div><h2 class=ac style="margin:0">👥 Friends</h2><small id=fs>Loading…</small></div><button id=fr aria-label=Refresh style="flex:0;width:auto;text-align:center">↻</button></div>
<div class=card style="display:flex;gap:8px;align-items:center"><div style="flex:1">${fld('fu','Friend\'s username')}</div><button class=p id=fa style="width:auto">Add</button></div>
<div id=fe class=c style="color:#a3162f;font-weight:700;min-height:20px"></div><div id=fb></div>

$i('fh').onclick=()=>{clearInterval(ft);home()};
push(true).then(load);clearInterval(ft);ft=setInterval(load,30000)}

let r=robot(),sp=spicy(),nm='@'+AU.username,k=dayHash()%3,th=themeChoice()=='auto'?(THEMES.find(x=>x[0]==themeId())||[])[2]:'',
msg=sp?[`Yo ${nm}! I'm ${r.name}, your study bot. Fresh day, fresh look: ${r.look}. Now quit lounging and let's farm some XP, damn it!`,`${r.name} reporting for duty in my ${r.look} outfit. ${S.streak?`Your streak is ${S.streak} days, so don't you dare screw it up.`:'You have no streak yet, so get your ass moving and start one.'}`,`Hell yeah, new day! The name's ${r.name}, today's look is ${r.look}. Let's kick some ass in ${CO.full}.`][k]
:[`Hi ${nm}! I'm ${r.name}, your study buddy today. New look: ${r.look}. Ready to learn?`,`${r.name} here in my ${r.look} outfit. ${S.streak?`Your streak is ${S.streak} days. Let's keep it going!`:"Let's start a streak today!"}`,`New day, new me! I'm ${r.name} (${r.look}). Let's explore ${CO.full}.`][k];

let qz=null,pokes=0,pokeT=0,idleT=Date.now();
function botLine(){let d=day(),left=Math.max(0,S.goal-d.xp),nm=AU?AU.username:'friend',sp=spicy(),now=Date.now();
if(qz){let c=qz;qz=null;return`${c.e} ${c.t}: ${c.d}`}

if(pokes>=6){pokes=0;return sp?pickOne(['Poke me one more time and I swear I\'ll unplug myself. Go study, damn it!','Quit poking me! Do a level instead, for crying out loud.']):'Hey, that tickles! Go play a level instead.'}
let L=[];
if(!d.g&&S.streak>0)L.push(...(sp?[`Damn, ${nm}, your ${S.streak}-day streak is on the line. ${left} XP to go. Move your ass.`,`Hell no, we are not losing a ${S.streak}-day streak today. Play a level. Now.`]:[`Your ${S.streak}-day streak needs ${left} more XP today. You can do it!`]));
if(d.xp==0)L.push(...(sp?[`Zero XP today? What the hell, ${nm}? One level. Go.`,`Crap, you have done nothing today. Tap Play already!`]:['No XP yet today. One level gets you started!']));
if(d.g)L.push(...(sp?['Hell yeah, goal smashed! Do not stop now, go for more XP.','Holy crap, look at you. Got energy for one more level?']:['Goal done! One more level for fun?']));
else if(d.xp>0)L.push(sp?`${left} XP to go. Quit dragging your feet, damn it.`:`Only ${left} XP to go!`);
let i=Math.floor(Math.random()*Math.max(3,Math.min(S.seen||3,D.length)));
L.push(['Q',D[i]]);let c=pickOne(L);
if(Array.isArray(c)){qz=c[1];return`Quick one: what is "${qz.t}"? Tap me again for the answer.`}return c}
document.addEventListener('click',e=>{idleT=Date.now();let b=e.target.closest('svg.bot');if(!b||!AU)return;b.classList.remove('happy','mad');void b.getBoundingClientRect();b.classList.add(pokes>=4?'mad':'happy');

})();
