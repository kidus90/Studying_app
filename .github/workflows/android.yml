name: Build Android APK

# Run it manually (Actions tab > Build Android APK > Run workflow),
# or push a tag like v1.0.0 to also publish the APK as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets
        run: |
          mkdir www
          cp index.html manifest.webmanifest www/
          cp -r icons www/

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Study Quest" com.kidus.studyquest --web-dir www
          npx cap add android
          # remove leftovers from older widget designs so they can't break the build
          rm -f android-widget/sw_c_empty.xml android-widget/sw_c_fire.xml android-widget/sw_c_today.xml android-widget/sw_pill.xml android-widget/widget_colors_night.xml
          bash scripts/add-widget.sh
          grep -n "StreakWidgetProvider" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Fix Kotlin duplicate dependencies
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // Align all Kotlin stdlib artifacts to one version so jdk7/jdk8 1.6.21 no longer clash with 1.8.22
          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          echo "---- tail of android/app/build.gradle ----"
          tail -15 android/app/build.gradle

      - name: Sign with the permanent key and bump the version
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ]; then
            echo "::error::Missing secrets KEYSTORE_B64, KEYSTORE_PASSWORD or KEYSTORE_ALIAS (repo Settings > Secrets and variables > Actions). Without them every build gets a new random key and phones refuse to update."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/study-quest.keystore
          cat >> android/app/build.gradle <<'EOF'

          // Same signing key on every build, so Android accepts the APK as an update
          android {
              signingConfigs {
                  debug {
                      storeFile file('study-quest.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEYSTORE_ALIAS')
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv('RUN_NUMBER') ?: '1')
                  versionName "1.0." + (System.getenv('RUN_NUMBER') ?: '1')
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug

      - name: Verify the widget is inside the APK
        run: |
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk")
          m = z.read("AndroidManifest.xml")
          ok = b"StreakWidgetProvider" in m or "StreakWidgetProvider".encode("utf-16le") in m
          print("WIDGET PRESENT IN APK" if ok else "WIDGET MISSING FROM APK")
          raise SystemExit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: study-quest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk